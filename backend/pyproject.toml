[project]
name = "flyin"
version = "0.1.0"
description = "Capacity-aware drone routing simulator for the 42 Fly-In project"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "flake8>=7,<8",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
# Third-party notice from starlette's TestClient wiring, not our code.
# Filtered by message so a real future warning is still surfaced.
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning"
]
