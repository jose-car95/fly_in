[project]
name = "flyin"
version = "0.1.0"
description = "Capacity-aware drone routing simulator for the 42 Fly-In project"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "flake8>=7,<8",
  "mypy>=1.15,<2",
  "pytest>=8,<9"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
