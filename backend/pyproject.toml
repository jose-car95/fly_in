[project]
name = "flyin"
version = "0.1.0"
description = "Capacity-aware drone routing simulator for the 42 Fly-In project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "flake8>=7,<8",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
]

# Run-a-command workflow (uv run / uv sync). This project is an application, not
# a library, so uv manages the environment but does not install flyin as a
# package; tests import it via the pythonpath below.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
