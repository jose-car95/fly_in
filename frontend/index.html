<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly-In</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Fly-In</h1>
      <p class="subtitle">Choose a map and simulate it.</p>

      <div class="toolbar">
        <select id="map-select" class="map-select">
          <option value="">Loading maps…</option>
        </select>
        <button id="simulate-btn" class="ctrl-btn primary" type="button">
          Simulate
        </button>
      </div>

      <section id="result" class="result" hidden>
        <h2 id="result-title" class="result-title"></h2>
        <p id="map-info" class="map-info"></p>
        <div class="map-controls">
          <button id="play-btn" class="ctrl-btn" type="button">▶ Play</button>
          <button id="stop-btn" class="ctrl-btn" type="button">■ Stop</button>
          <span id="turn-label" class="turn-label"></span>
          <button id="turns-btn" class="ctrl-btn" type="button">
            Turns…
          </button>
          <span class="zoom-controls">
            <button id="zoom-out" class="ctrl-btn" type="button">−</button>
            <button id="zoom-reset" class="ctrl-btn" type="button"
              title="Reset view">↺</button>
            <button id="zoom-in" class="ctrl-btn" type="button">+</button>
          </span>
        </div>
        <div id="map-view" class="map-view"></div>
        <div id="metrics" class="metrics"></div>
      </section>
    </main>

    <div id="turns-modal" class="modal" hidden>
      <div class="modal-box">
        <div class="modal-head">
          <h3 class="modal-title">Turns</h3>
          <button id="turns-close" class="ctrl-btn" type="button">✕</button>
        </div>
        <ol id="turns" class="turns"></ol>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
