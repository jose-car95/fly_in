[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flyin"
version = "0.1.0"
description = "Capacity-aware drone routing simulator for the 42 Fly-In project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "flake8>=7,<8",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
]
